[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-engine-alan-vo"
version = "1.0.0"
description = "Retrieval-Augmented Generation engine with hybrid dense-sparse retrieval and citation verification"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Alan Vo", email = "alanvo@gmail.com" }
]
dependencies = [
  "fastapi>=0.110.0",
  "uvicorn[standard]>=0.29.0",
  "pydantic>=2.6.0",
  "pydantic-settings>=2.2.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "python-multipart>=0.0.9"
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
